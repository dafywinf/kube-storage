local-path-storage:
  enabled: true
  storageClassName: "local-path-mnt-data"
  # NOTE: k3s bundles local-path-provisioner v0.0.27, which IGNORES this StorageClass `path` parameter.
  # Volumes go wherever k3s's local-path-config points: set by the k3s server flag
  # --default-local-storage-path /mnt/data/local-storage (k3s-cluster-bootstrap group_vars).
  # Before 2026-11-15 that flag was unset, and volumes landed on the 30 GiB root disk.
  path: /mnt/data/local-storage

longhorn:
  enabled: true
  defaultSettings:
    defaultReplicaCount: 2
    defaultDataPath: /mnt/data/longhorn-storage
    createDefaultDiskLabeledNodes: false
  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: traefik
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    host: longhorn.192-168-86-10.sslip.io
    tls: true
  persistence:
    defaultClass: true
    defaultClassReplicaCount: 2

###############################
# Performance Test Containers #
###############################

# Note: This is the default rancher local-storage
local-path-fio-performance-test:
  enabled: true
  delaySeconds: 0
  testResourcePrefix: "local-path"
  storageClass: "local-path"
  volumeSize: 10Gi
  fio:
    size: 5Gi

local-path-mnt-data-fio-performance-test:
  enabled: true
  delaySeconds: 0
  testResourcePrefix: "local-path-mnt-data"
  storageClass: "local-path-mnt-data"
  volumeSize: 10Gi
  fio:
    size: 5Gi

longhorn-fio-performance-test:
  enabled: true
  delaySeconds: 0
  testResourcePrefix: "longhorn"
  storageClass: "longhorn"
  volumeSize: 10Gi
  fio:
    size: 5Gi




